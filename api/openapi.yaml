openapi: 3.1.0
info:
  title: boAIrd API
  version: 1.0.0
  description: >-
    Versioned local-first API for managing boAIrd projects. Until authenticated
    remote mode exists, the server binds only to a loopback IP address. Every
    operation requires the local administrator bearer token unless an endpoint
    explicitly documents otherwise. After POST /api/v1/session, same-origin
    browser clients may use a short-lived opaque HttpOnly session cookie instead
    of retaining the token in application storage. Session identifiers are stored
    in memory by the server, expire after 30 minutes, and are revoked at logout
    or service restart. The server evaluates a required
    capability and project membership for each operation.
servers:
  - url: http://127.0.0.1:3110
security:
  - localBearerAuth: []
  - localSessionCookie: []
paths:
  /api/v1/session:
    post:
      operationId: createLocalSession
      summary: Exchange the local administrator token for a browser session cookie
      description: Accepts the configured token in the Authorization header and sets an HttpOnly, SameSite=Strict cookie containing a random opaque session identifier. The identifier is stored server-side, expires after 30 minutes, and is not the administrator token.
      security:
        - localBearerAuth: []
      responses:
        '204': { description: A 30-minute browser session cookie was created. }
        '401': { description: Missing or invalid local administrator bearer token. }
    get:
      operationId: getLocalSession
      summary: Validate the current local administrator session
      security:
        - localBearerAuth: []
        - localSessionCookie: []
      responses:
        '204': { description: The bearer token or session cookie is valid. }
        '401': { description: Missing or invalid local administrator credentials. }
    delete:
      operationId: deleteLocalSession
      summary: Revoke the current browser session and clear its cookie
      security: []
      description: If a browser session cookie is present, a trusted dashboard Origin is required and that session is revoked. This endpoint clears the client cookie; it does not revoke the configured direct Bearer credential.
      responses:
        '204': { description: Session cookie cleared. }
  /api/v1/projects:
    post:
      operationId: createProject
      x-required-capability: project.create
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created in CREATED state.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listProjects
      x-required-capability: project.read
      summary: List projects
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Projects ordered by name and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      x-required-capability: project.read
      summary: Get a project
      responses:
        '200':
          description: Project found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      x-required-capability: project.update
      summary: Update project configuration
      description: Archived projects are immutable. Omitted fields are unchanged. An empty brain_id unsets the Brain association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveProject
      x-required-capability: project.archive
      summary: Archive a project
      description: Archives the project instead of deleting its stored data. Repeated requests are safe and return the archived project.
      responses:
        '200':
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credentials:
    post:
      operationId: createCredential
      x-required-capability: credential.create
      summary: Store an encrypted provider credential
      description: The submitted secret is encrypted at rest and is never included in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredential'
      responses:
        '201':
          description: Credential metadata only.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listCredentials
      x-required-capability: credential.read
      summary: List stored credential metadata
      description: Secret values and ciphertext are never returned.
      responses:
        '200':
          description: Credential metadata only.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{id}/brain:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: configureProjectBrain
      x-required-capability: brain.attach
      summary: Attach the project's only Brain
      description: Requires a registered API or MCP Agent with the explicit brain.execute capability. MCP Agents authenticate with their issued MCP token when using tools. The autonomy value controls Brain decision behavior but never adds capabilities. Provider credential resolution is scoped to an API Brain and this project. A project Brain cannot replace itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBrain' }
      responses:
        '201':
          description: Brain attached to the project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The project already has a Brain.
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getProjectBrain
      x-required-capability: brain.read
      summary: Get the project's active Brain
      responses:
        '200':
          description: Active Brain configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brain' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: replaceProjectBrain
      x-required-capability: brain.replace
      summary: Replace the project's active Brain configuration
      description: Requires an authenticated local administrator bearer token or browser session. The replacement must use a registered API or MCP Agent with the explicit brain.execute capability and include an audit reason. Autonomy changes are recorded as brain.autonomy.changed.
      security:
        - localBearerAuth: []
        - localSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceBrain' }
      responses:
        '200':
          description: Updated Brain configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or invalid local administrator bearer token. }
        '403': { description: Replacement agent is not authorized to execute as Brain. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Brain configuration changed concurrently. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{id}/brain/runs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: executeProjectBrain
      x-required-capability: brain.execute
      summary: Ask the Brain to propose a plan
      description: For an API-backed Brain, persists a run and returns text from the configured provider. Credential resolution is limited to the active Brain Agent and this project. An MCP Brain uses its authenticated MCP tools; this endpoint returns 409 and creates no run. This endpoint does not apply task or project mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteBrain' }
      responses:
        '201':
          description: Completed Brain run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrainRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Brain action is not allowed by project policy or explicit capabilities.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The active Brain uses an external runtime and must execute through its authenticated MCP session.
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{id}/runs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listProjectRuns
      x-required-capability: run.read
      summary: List project runs
      description: Filters by optional task_id and agent_id. Stored and returned text has common credential forms redacted.
      parameters:
        - name: task_id
          in: query
          schema: { type: string }
        - name: agent_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Project runs with linked immutable audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{id}/orchestration/dispatch:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dispatchProjectTasks
      x-required-capability: task.assign
      summary: Schedule eligible READY tasks and execute assigned API Agents
      description: Claims READY tasks through the Brain actor using existing task policy, creates one Run per attempt, submits successful work to REVIEW, and returns failures to the Brain for a bounded retry. Externally hosted Agents are skipped because they claim work through MCP. Escalations are recorded as immutable audit events.
      responses:
        '200':
          description: One outcome per scheduled task; retryable failures return the task to READY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The Brain lacks the capability or autonomy required by project policy, or the caller is not authorized. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The project is archived or the task changed concurrently. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRun
      x-required-capability: run.read
      summary: Get a run and its audit events
      responses:
        '200':
          description: Run details with text redaction and linked immutable audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createTask
      x-required-capability: task.create
      summary: Create a task in a project
      description: The local API records a fixed local API actor; callers cannot provide or override actor identity. A reason is required for audit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '201':
          description: Task created in BACKLOG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listProjectTasks
      x-required-capability: task.read
      summary: List tasks in a project
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [BACKLOG, READY, WORKING, REVIEW, HUMAN_REVIEW, BLOCKED, FAILED, DONE, CANCELLED] }
        - name: assigned_to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Tasks ordered by workflow status and creation time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTask
      x-required-capability: task.read
      summary: Get a task and immutable audit events
      responses:
        '200':
          description: Task details and linked immutable audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/assignment:
    put:
      operationId: assignTask
      x-required-capability: task.assign
      summary: Assign a task to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignTask' }
      responses:
        '200':
          description: Assignment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Actor lacks the required task capability. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Task changed after it was read; reload the task and retry. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/transitions:
    post:
      operationId: transitionTask
      x-required-capability: task.transition
      summary: Move a task through a validated workflow transition
      description: An Agent may use task.transition only for a task currently assigned to that Agent; that assignment grants scope only to the task's project. Transitions from HUMAN_REVIEW to WORKING, DONE, or CANCELLED require an administrator.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionTask' }
      responses:
        '200':
          description: Task status updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Actor lacks the required task capability, human review is required, or a HUMAN_REVIEW action was attempted by a non-administrator. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Task changed after it was read; reload the task and retry. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/review:
    post:
      operationId: reviewTask
      x-required-capability: task.review
      summary: Apply the Brain verdict to submitted work
      description: APPROVE completes the task when policy allows; otherwise it moves the task to HUMAN_REVIEW without bypassing the configured gate. REWORK returns the task to the worker with instructions and creates a new Run within the configured attempt limit.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewTask' }
      responses:
        '200':
          description: Task status after the review decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The Brain lacks the capability or autonomy required by project policy. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The task is not in REVIEW, changed concurrently, or project policy requires human approval.
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTaskMessages
      x-required-capability: conversation.read
      summary: Retrieve the task conversation history
      description: Requires the authenticated local administrator session and project membership. Returns the newest bounded page in chronological order; use next_before as before to fetch older messages. Message content and metadata are redacted before persistence and return.
      security:
        - localBearerAuth: []
        - localSessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: Message ID cursor returned as next_before by the preceding page.
          schema: { type: string }
      responses:
        '200':
          description: Conversation and bounded messages ordered by creation time. next_before is present when older messages remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or invalid local bearer token. }
        '403': { description: Caller is not a member of the project. }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createTaskMessage
      x-required-capability: conversation.write
      summary: Add a message to a task conversation
      description: Requires the authenticated local administrator session and project membership. The server derives sender identity from the authenticated local principal; caller-supplied sender identity is rejected.
      security:
        - localBearerAuth: []
        - localSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationMessage' }
      responses:
        '201':
          description: Message created with redacted content and metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or invalid local bearer token. }
        '403': { description: Sender is not authorized for this task. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The project is archived and cannot accept messages. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteCredential
      x-required-capability: credential.delete
      summary: Delete a stored credential
      responses:
        '204':
          description: Credential deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/agents:
    post:
      operationId: createAgent
      x-required-capability: agent.create
      summary: Create a specialized agent
      description: Role is descriptive and never grants capabilities. API runtimes require provider, model, and an existing credential reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgent'
      responses:
        '201':
          description: Agent created with IDLE status. Runtime status becomes server-derived once the Agent authenticates.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listAgents
      x-required-capability: agent.read
      summary: List agents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Agents ordered by name and ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/mcp/tokens:
    get:
      operationId: listMCPAgentTokens
      x-required-capability: mcp.token.manage
      summary: List MCP Agent token metadata
      description: Returns token IDs, Agent IDs, issue/expiry/revocation metadata, and status. Token verifiers and plaintext credentials are never returned.
      responses:
        '200':
          description: MCP Agent token metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPAgentTokenPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createMCPAgentToken
      x-required-capability: mcp.token.manage
      summary: Issue an expiring MCP Agent bearer token
      description: The 32-byte random token is returned once. Only its one-way SHA-256 verifier is persisted. Expiry must be between one second and 365 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMCPAgentToken' }
      responses:
        '201':
          description: Token issued. Store the returned token securely; it cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedMCPAgentToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/mcp/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeMCPAgentToken
      x-required-capability: mcp.token.manage
      summary: Revoke an MCP Agent token
      description: Revocation takes effect on the next MCP HTTP request. Any session using the revoked token can no longer make requests.
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Token is already revoked or expired. }
  /api/v1/mcp/tokens/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rotateMCPAgentToken
      x-required-capability: mcp.token.manage
      summary: Atomically revoke an MCP Agent token and issue its replacement
      description: The replacement remains bound to the same Agent and is returned once. Requests using the old token fail immediately after rotation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateMCPAgentToken' }
      responses:
        '201':
          description: Replacement token issued once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedMCPAgentToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Token is already revoked or expired. }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAgent
      x-required-capability: agent.read
      summary: Get an agent
      responses:
        '200':
          description: Agent configuration plus server-derived runtime status and session liveness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAgent
      x-required-capability: agent.update
      summary: Update agent configuration
      description: Status is read-only; role labels do not grant capabilities. Switching away from API clears provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgent' }
      responses:
        '200':
          description: Updated agent configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/agents/{id}/status-events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      operationId: listAgentStatusEvents
      x-required-capability: agent.read
      summary: List observed Agent status transitions
      description: Immutable transitions derived from authenticated sessions and work signals, newest first.
      responses:
        '200':
          description: Agent status events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatusEventPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectID}/agents/{agentID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: agentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: addAgentToProject
      x-required-capability: agent.scope.manage
      summary: Grant an Agent explicit access to a project
      description: Only the authenticated administrator can manage scope. The membership is persisted and the change is audited; roles do not grant project access.
      responses:
        '204': { description: Agent is a member of the project. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: removeAgentFromProject
      x-required-capability: agent.scope.manage
      summary: Revoke an Agent's explicit project access
      description: The membership removal is persisted and audited. Removing a missing membership is idempotent.
      responses:
        '204': { description: Agent is not a member of the project. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/profiles:
    get:
      operationId: listAgentProfiles
      x-required-capability: agent.read
      summary: List the built-in specialized agent profiles
      description: Returns task scope, default instructions, runtime defaults, and suggested tools and capabilities. Suggested values are hints and never grant authority.
      responses:
        '200':
          description: Profile catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectID}/profiles:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listEffectiveProjectProfiles
      x-required-capability: agent.read
      summary: Resolve every profile for a project
      description: Effective capabilities and tools come only from administrator-configured overrides; uncustomized profiles grant nothing.
      responses:
        '200':
          description: Effective profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EffectiveProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectID}/profiles/{key}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEffectiveProjectProfile
      x-required-capability: agent.read
      summary: Resolve one profile for a project
      responses:
        '200':
          description: Effective profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: saveProjectProfile
      x-required-capability: agent.scope.manage
      summary: Customize a profile for one project
      description: Persists an administrator-configured override and records an immutable audit event. Capabilities are granted explicitly; tools must be among the profile's suggested tools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProfile' }
      responses:
        '200':
          description: Effective profile after the override.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    localBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Hex-encoded 32-byte BOAIRD_LOCAL_AUTH_TOKEN
    localSessionCookie:
      type: apiKey
      in: cookie
      name: boaird_local_auth
      description: Random opaque session identifier issued for 30 minutes and validated against server-side in-memory state.
  schemas:
    CreateBrain:
      type: object
      additionalProperties: false
      required: [agent_id, autonomy]
      properties:
        agent_id: { type: string }
        autonomy:
          type: string
          enum: [MANUAL, SEMI_AUTO, AUTONOMOUS]
          description: MANUAL is plan-only; SEMI_AUTO requires human approval for task completion; AUTONOMOUS completion still requires task.complete and project policy to allow it.
    ReplaceBrain:
      type: object
      additionalProperties: false
      required: [agent_id, autonomy, reason]
      properties:
        agent_id: { type: string }
        autonomy:
          type: string
          enum: [MANUAL, SEMI_AUTO, AUTONOMOUS]
          description: MANUAL is plan-only; SEMI_AUTO requires human approval for task completion; AUTONOMOUS completion still requires task.complete and project policy to allow it.
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Brain:
      type: object
      required: [id, project_id, agent_id, autonomy, active]
      properties:
        id: { type: string }
        project_id: { type: string }
        agent_id: { type: string }
        autonomy:
          type: string
          enum: [MANUAL, SEMI_AUTO, AUTONOMOUS]
          description: Effective decision mode. It never grants capabilities or bypasses project human-review policy.
        active: { type: boolean, readOnly: true }
    ExecuteBrain:
      type: object
      additionalProperties: false
      required: [objective]
      properties:
        objective: { type: string, minLength: 1, maxLength: 16384 }
        max_tokens: { type: integer, minimum: 1, maximum: 4096, default: 2048 }
    BrainRun:
      type: object
      required: [id, status, provider, model]
      properties:
        id: { type: string }
        status: { type: string, const: SUCCESS }
        provider: { type: string }
        model: { type: string }
        content: { type: string }
    Run:
      type: object
      required: [id, project_id, agent_id, runtime, provider, model, status, input, output, tools_used, audit_events]
      properties:
        id: { type: string }
        project_id: { type: string }
        task_id: { type: string }
        agent_id: { type: string }
        runtime: { type: string }
        provider: { type: string }
        model: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCESS, FAILED, CANCELLED] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        input: { type: string, description: Sensitive text is redacted before persistence and display. }
        output: { type: string, description: Sensitive text is redacted before persistence and display. }
        error: { type: string, description: Provider error bodies and common secret forms are omitted. }
        tools_used: { type: array, items: { type: string } }
        audit_events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
    RunPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        limit: { type: integer }
        offset: { type: integer }
    AuditEvent:
      type: object
      required: [id, project_id, actor_type, actor_id, event_type, resource_type, resource_id, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        task_id: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        event_type:
          type: string
          description: Human-review decisions use task.human_review.approved when moving to DONE and task.human_review.rejected when returning to WORKING.
        resource_type: { type: string }
        resource_id: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        reason:
          type: string
          description: Required rationale for the review decision.
        created_at: { type: string, format: date-time }
    CreateTask:
      type: object
      additionalProperties: false
      required: [title, reason]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 16000 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
        parent_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    AssignTask:
      type: object
      additionalProperties: false
      required: [agent_id, reason]
      properties:
        agent_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    TransitionTask:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [BACKLOG, READY, WORKING, REVIEW, HUMAN_REVIEW, BLOCKED, FAILED, DONE, CANCELLED] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    Task:
      type: object
      required: [id, project_id, title, description, status, priority, created_by, created_by_type, human_review_required, created_at, updated_at, version]
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [BACKLOG, READY, WORKING, REVIEW, HUMAN_REVIEW, BLOCKED, FAILED, DONE, CANCELLED] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        created_by: { type: string }
        created_by_type: { type: string, enum: [LOCAL_API_CLIENT, ADMINISTRATOR, BRAIN, AGENT] }
        assigned_to: { type: string }
        human_review_required: { type: boolean }
        parent_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: Monotonically increasing task version for detecting stale concurrent mutations. }
        audit_events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
    ReviewTask:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, REWORK] }
        reason: { type: string, maxLength: 2000, description: Required for REWORK; stored in the task audit event. }
    ExecutionOutcome:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string }
        run_id: { type: string }
        status: { type: string, enum: [SUCCEEDED, RETRY_SCHEDULED, ESCALATED, SKIPPED] }
        reason: { type: string }
        context_selection:
          $ref: '#/components/schemas/ContextSelectionSummary'
    ContextSelectionSummary:
      type: object
      required: [project_id, selected, omitted, bytes, estimated_tokens]
      properties:
        project_id: { type: string }
        task_id: { type: string }
        selected:
          type: array
          items: { $ref: '#/components/schemas/SelectedContextItem' }
        omitted:
          type: array
          items: { $ref: '#/components/schemas/OmittedContextItem' }
        bytes: { type: integer, minimum: 0 }
        estimated_tokens: { type: integer, minimum: 0 }
    SelectedContextItem:
      type: object
      required: [id, project_id, source, trust, bytes]
      properties:
        id: { type: string }
        project_id: { type: string }
        task_id: { type: string }
        source: { type: string, enum: [project, task, file, conversation, memory, run, repository, brain, agent, external] }
        trust: { type: string, enum: [SYSTEM, ADMIN, PROJECT_POLICY, BRAIN, AGENT, REPOSITORY, EXTERNAL, UNTRUSTED] }
        bytes: { type: integer, minimum: 0 }
    OmittedContextItem:
      type: object
      properties:
        id: { type: string }
        source: { type: string, enum: [project, task, file, conversation, memory, run, repository, brain, agent, external] }
        reason: { type: string }
    DispatchReport:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/ExecutionOutcome' }
    TaskPage:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        limit: { type: integer }
        offset: { type: integer }
    CreateConversationMessage:
      type: object
      additionalProperties: false
      required: [content, content_type]
      properties:
        content: { type: string, minLength: 1, maxLength: 1048576, description: Opaque message payload; its interpretation follows content_type. }
        content_type: { type: string, minLength: 1, maxLength: 128, example: application/json }
        metadata: { type: object, additionalProperties: true, description: Sensitive keys and common secret patterns are redacted before storage. }
    ConversationMessage:
      type: object
      required: [id, conversation_id, sender_type, sender_id, content, content_type, metadata, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        sender_type: { type: string, enum: [USER, AGENT, BRAIN, SYSTEM] }
        sender_id: { type: string, description: Server-derived sender identity. }
        content: { type: string, description: Opaque payload with sensitive patterns redacted. }
        content_type: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, project_id, task_id, messages]
      properties:
        id: { type: string }
        project_id: { type: string }
        task_id: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/ConversationMessage' } }
        next_before: { type: string, description: Cursor for fetching the next older page; omitted when there are no older messages. }
    CreateMCPAgentToken:
      type: object
      additionalProperties: false
      required: [agent_id, expires_in_seconds]
      properties:
        agent_id: { type: string, format: uuid }
        expires_in_seconds: { type: integer, minimum: 1, maximum: 31536000, description: Token lifetime in seconds, at most 365 days. }
    RotateMCPAgentToken:
      type: object
      additionalProperties: false
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, minimum: 1, maximum: 31536000, description: Replacement token lifetime in seconds, at most 365 days. }
    MCPAgentToken:
      type: object
      required: [id, agent_id, issued_at, expires_at, status]
      properties:
        id: { type: string }
        agent_id: { type: string, format: uuid }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        status: { type: string, enum: [active, expired, revoked] }
    MCPAgentTokenPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MCPAgentToken' } }
    IssuedMCPAgentToken:
      allOf:
        - $ref: '#/components/schemas/MCPAgentToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, pattern: '^[a-f0-9]{64}$', description: Raw token shown only once. }
    CreateAgent:
      type: object
      additionalProperties: false
      required: [name, role, runtime]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        avatar: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 4000 }
        role: { type: string, minLength: 1, maxLength: 100, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string, maxLength: 100 }
        provider_base_url: { type: string, maxLength: 2048, format: uri, description: "Optional provider endpoint. Built-in vendor defaults and explicit loopback development URLs are allowed; custom hosts require an exact BOAIRD_PROVIDER_ALLOWED_HOSTS entry. HTTP is restricted to loopback. Private, link-local, metadata, and special-purpose resolved IP ranges recognized by the endpoint policy are denied unless explicitly covered by BOAIRD_PROVIDER_ALLOWED_IP_RANGES. Redirects and proxies are disabled." }
        model: { type: string, maxLength: 200 }
        credential_id: { type: string, maxLength: 200, description: Reference to a stored credential; raw secrets are never accepted here. }
        instructions: { type: string, maxLength: 16000 }
        language_preferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        capabilities:
          type: array
          maxItems: 100
          description: Explicit capability identifiers; never derived from role.
          items: { type: string, pattern: '^[a-z][a-z0-9]*(?:\.[a-z0-9]+)*$' }
      allOf:
        - if:
            properties: { runtime: { const: API } }
          then:
            required: [provider, model, credential_id]
    UpdateAgent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        avatar: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 4000 }
        role: { type: string, minLength: 1, maxLength: 100, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string, maxLength: 100 }
        provider_base_url: { type: string, maxLength: 2048, format: uri, description: "Optional provider endpoint. Built-in vendor defaults and explicit loopback development URLs are allowed; custom hosts require an exact BOAIRD_PROVIDER_ALLOWED_HOSTS entry. HTTP is restricted to loopback. Private, link-local, metadata, and special-purpose resolved IP ranges recognized by the endpoint policy are denied unless explicitly covered by BOAIRD_PROVIDER_ALLOWED_IP_RANGES. Redirects and proxies are disabled." }
        model: { type: string, maxLength: 200 }
        credential_id: { type: string, maxLength: 200, description: Assigning a credential is administrator-only; runtime use is further restricted to this Agent's persisted project scope. }
        instructions: { type: string, maxLength: 16000 }
        language_preferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        capabilities:
          type: array
          maxItems: 100
          items: { type: string, pattern: '^[a-z][a-z0-9]*(?:\.[a-z0-9]+)*$' }
    Agent:
      type: object
      required: [id, name, avatar, description, role, runtime, instructions, language_preferences, capabilities, project_ids, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        description: { type: string }
        role: { type: string, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string }
        provider_base_url: { type: string, description: "Built-in vendor defaults and explicit loopback development URLs are allowed; custom hosts require an exact BOAIRD_PROVIDER_ALLOWED_HOSTS entry. HTTP is restricted to loopback. Private, link-local, metadata, and special-purpose resolved IP ranges recognized by the endpoint policy are denied unless explicitly covered by BOAIRD_PROVIDER_ALLOWED_IP_RANGES. Redirects and proxies are disabled." }
        model: { type: string }
        credential_id: { type: string, description: Reference only; never a raw credential. Resolution also requires this Agent's project membership or active-Brain relationship. }
        instructions: { type: string }
        language_preferences: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        project_ids: { type: array, description: Persisted explicit project scope; managed through the project membership endpoints., items: { type: string, format: uuid }, readOnly: true }
        status: { type: string, readOnly: true, description: Server-derived from authenticated sessions and observed work; clients never submit a status., enum: [ONLINE, IDLE, BUSY, WAITING, OFFLINE, STALE, ERROR] }
        last_seen_at: { type: string, format: date-time, readOnly: true, description: Most recent authenticated activity of an open session. }
        session_open: { type: boolean, readOnly: true, description: Whether an unexpired session is bound to this Agent. }
    AgentStatusEvent:
      type: object
      required: [sequence, agent_id, from_status, to_status, reason, created_at]
      properties:
        sequence: { type: integer, format: int64 }
        agent_id: { type: string, format: uuid }
        session_id: { type: string, description: Session that observed the transition; empty when no session was open. }
        from_status: { type: string, enum: [ONLINE, IDLE, BUSY, WAITING, OFFLINE, STALE, ERROR] }
        to_status: { type: string, enum: [ONLINE, IDLE, BUSY, WAITING, OFFLINE, STALE, ERROR] }
        reason: { type: string, enum: [session.opened, session.resumed, session.expired, work.changed, status.reconciled] }
        created_at: { type: string, format: date-time }
    AgentStatusEventPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentStatusEvent' }
        limit: { type: integer }
        offset: { type: integer }
    AgentPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
        limit: { type: integer }
        offset: { type: integer }
    CreateCredential:
      type: object
      additionalProperties: false
      required: [name, provider, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 100 }
        secret:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    Credential:
      type: object
      description: Metadata only. Provider execution resolves a secret only for the Agent and project scope supplied by the server.
      required: [id, name, provider]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          default: ''
        workspace_path:
          type: string
          description: Optional absolute path to an existing directory; the server resolves symlinks and stores the canonical path.
        repository_url:
          type: string
          description: Optional absolute HTTP, HTTPS, or SSH URL.
        human_review_required:
          type: boolean
          default: true
    UpdateProject:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        workspace_path:
          type: string
          description: Empty string clears the workspace. Non-empty values must resolve to an existing directory.
        repository_url:
          type: string
          description: Empty string clears the repository URL.
        human_review_required:
          type: boolean
        brain_id:
          type: string
          description: Empty string clears the Brain association. Non-empty values must identify an active Brain registered to this project.
    Project:
      type: object
      description: Status is read-only through the project API. Lifecycle transitions are managed by the backend and require a registered active Brain before READY or RUNNING.
      required: [id, name, description, status, human_review_required]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [CREATED, CONFIGURING, READY, RUNNING, PAUSED, ARCHIVED]
        brain_id:
          type: string
        workspace_path:
          type: string
        repository_url:
          type: string
        human_review_required:
          type: boolean
    ProjectPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    ProfileDefinition:
      type: object
      required: [key, name, description, instructions, default_runtime, suggested_tools, suggested_capabilities]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string }
        default_runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        suggested_tools:
          type: array
          items: { type: string }
        suggested_capabilities:
          type: array
          items: { type: string }
    EffectiveProfile:
      type: object
      required: [key, name, description, instructions, default_runtime, capabilities, tools, suggested_tools, suggested_capabilities, customized]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string }
        default_runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        capabilities:
          type: array
          items: { type: string }
          description: Explicitly configured capabilities only; never granted by the profile name.
        tools:
          type: array
          items: { type: string }
          description: Explicitly configured tools, limited to the profile's suggested tools.
        suggested_tools:
          type: array
          items: { type: string }
        suggested_capabilities:
          type: array
          items: { type: string }
        customized: { type: boolean }
    SaveProfile:
      type: object
      additionalProperties: false
      properties:
        instructions: { type: string, maxLength: 16000 }
        capabilities:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid administrator bearer token or session cookie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The administrator is not authorized for this operation or project.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request body, query parameter, project value, or agent configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Project does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server or storage failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
