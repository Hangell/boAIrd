openapi: 3.1.0
info:
  title: boAIrd API
  version: 1.0.0
  description: >-
    Versioned local-first API for managing boAIrd projects. Until authenticated
    remote mode exists, the server binds only to a loopback IP address.
servers:
  - url: http://127.0.0.1:3110
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created in CREATED state.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Projects ordered by name and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: Project found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: Update project configuration
      description: Archived projects are immutable. Omitted fields are unchanged. An empty brain_id unsets the Brain association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveProject
      summary: Archive a project
      description: Archives the project instead of deleting its stored data. Repeated requests are safe and return the archived project.
      responses:
        '200':
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credentials:
    post:
      operationId: createCredential
      summary: Store an encrypted provider credential
      description: The submitted secret is encrypted at rest and is never included in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredential'
      responses:
        '201':
          description: Credential metadata only.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listCredentials
      summary: List stored credential metadata
      description: Secret values and ciphertext are never returned.
      responses:
        '200':
          description: Credential metadata only.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteCredential
      summary: Delete a stored credential
      responses:
        '204':
          description: Credential deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/agents:
    post:
      operationId: createAgent
      summary: Create a specialized agent
      description: Role is descriptive and never grants capabilities. API runtimes require provider, model, and an existing credential reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgent'
      responses:
        '201':
          description: Agent created with IDLE status.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listAgents
      summary: List agents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Agents ordered by name and ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAgent
      summary: Get an agent
      responses:
        '200':
          description: Agent configuration. Status is managed by the runtime.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAgent
      summary: Update agent configuration
      description: Status is read-only; role labels do not grant capabilities. Switching away from API clears provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgent' }
      responses:
        '200':
          description: Updated agent configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    CreateAgent:
      type: object
      additionalProperties: false
      required: [name, role, runtime]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        avatar: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 4000 }
        role: { type: string, minLength: 1, maxLength: 100, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 200 }
        credential_id: { type: string, maxLength: 200, description: Reference to a stored credential; raw secrets are never accepted here. }
        instructions: { type: string, maxLength: 16000 }
        language_preferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        capabilities:
          type: array
          maxItems: 100
          description: Explicit capability identifiers; never derived from role.
          items: { type: string, pattern: '^[a-z][a-z0-9]*(?:\.[a-z0-9]+)*$' }
      allOf:
        - if:
            properties: { runtime: { const: API } }
          then:
            required: [provider, model, credential_id]
    UpdateAgent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        avatar: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 4000 }
        role: { type: string, minLength: 1, maxLength: 100, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 200 }
        credential_id: { type: string, maxLength: 200 }
        instructions: { type: string, maxLength: 16000 }
        language_preferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        capabilities:
          type: array
          maxItems: 100
          items: { type: string, pattern: '^[a-z][a-z0-9]*(?:\.[a-z0-9]+)*$' }
    Agent:
      type: object
      required: [id, name, avatar, description, role, runtime, instructions, language_preferences, capabilities, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        description: { type: string }
        role: { type: string, description: Descriptive label only; it grants no permissions. }
        runtime: { type: string, enum: [API, MCP, LOCAL, REMOTE] }
        provider: { type: string }
        model: { type: string }
        credential_id: { type: string, description: Reference only; never a raw credential. }
        instructions: { type: string }
        language_preferences: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        status: { type: string, readOnly: true, enum: [ONLINE, IDLE, BUSY, WAITING, OFFLINE, STALE, ERROR] }
    AgentPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
        limit: { type: integer }
        offset: { type: integer }
    CreateCredential:
      type: object
      additionalProperties: false
      required: [name, provider, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 100 }
        secret:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    Credential:
      type: object
      required: [id, name, provider]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          default: ''
        workspace_path:
          type: string
          description: Optional absolute path to an existing directory; the server resolves symlinks and stores the canonical path.
        repository_url:
          type: string
          description: Optional absolute HTTP, HTTPS, or SSH URL.
        human_review_required:
          type: boolean
          default: true
    UpdateProject:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        workspace_path:
          type: string
          description: Empty string clears the workspace. Non-empty values must resolve to an existing directory.
        repository_url:
          type: string
          description: Empty string clears the repository URL.
        human_review_required:
          type: boolean
        brain_id:
          type: string
          description: Empty string clears the Brain association. Non-empty values must identify an active Brain registered to this project.
    Project:
      type: object
      description: Status is read-only through the project API. Lifecycle transitions are managed by the backend and require a registered active Brain before READY or RUNNING.
      required: [id, name, description, status, human_review_required]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [CREATED, CONFIGURING, READY, RUNNING, PAUSED, ARCHIVED]
        brain_id:
          type: string
        workspace_path:
          type: string
        repository_url:
          type: string
        human_review_required:
          type: boolean
    ProjectPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request body, query parameter, project value, or agent configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Project does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server or storage failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
